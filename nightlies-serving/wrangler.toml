name = "nightlies-serving"
main = "src/worker.js"
compatibility_date = "2024-09-23"
account_id = "32578e55e8e251552382924d4855e414"
workers_dev = true

# Single worker, no separate envs; a single-file ES module needs no build step,
# so wrangler uploads src/worker.js directly (no webpack/esbuild config).
# Zone is now specified per-route (wrangler 4 dropped the top-level zone_id).
routes = [
  { pattern = "get-nats.io/nightly/*", zone_id = "4b53c2442ec2650d13753d68bc90ffd7" },
  { pattern = "get-nats.io/current-nightly", zone_id = "4b53c2442ec2650d13753d68bc90ffd7" },
]

kv_namespaces = [
  { binding = "ASSETS", id = "eb4407c72ba74904b9602a60813a42ee" }
]
